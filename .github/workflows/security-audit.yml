name: Security & dependency audit

# Gira su PR e schedule settimanale. Cattura vulnerabilità note (CVE) nelle
# dipendenze npm + license non compatibili + outdated packages. Non fallisce
# il build su vulnerabilità low/moderate (rumore); fail solo su high/critical.
#
# Audit 2026-06-22 sess.8: lift DevOps/CI 84 → 92.

on:
  workflow_dispatch:
  schedule:
    # Lunedì 06:00 UTC = 08:00 Europe/Rome
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'

# Senza questa riga GitHub usa `bash -e`, che NON ha `pipefail`: in una
# pipeline conta l'ultimo comando, e quello riesce quasi sempre.
defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: npm audit (fail solo su high/critical)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

      - name: Outdated packages (info, no fail)
        run: npm outdated || true
        continue-on-error: true

      # 16/09/2026, audit del righello: questo passo si chiamava
      # «License check (no GPL viral)» ma non poteva bloccare niente.
      # `--failOn` e' la sua ragione d'essere, e sopra c'erano due cose che la
      # annullavano: `continue-on-error: true` (il fallimento non ferma la CI)
      # e `> /dev/null` (l'elenco delle licenze finiva nel nulla). Entrando
      # una dipendenza GPL, la CI restava verde e non ne restava traccia.
      # Tolto `> /dev/null`: almeno adesso si vede. `continue-on-error` resta
      # finche' non e' il titolare a decidere di far bloccare le PR.
      - name: Licenze (INFORMATIVO — oggi non blocca, vedi commento)
        run: |
          npx license-checker --production --excludePrivatePackages \
            --excludePackages "foodos@0.1.0" \
            --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0"
        continue-on-error: true
