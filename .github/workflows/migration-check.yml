# Migrazioni nuove: elenco e promemoria.
#
# 16/09/2026 — questo workflow scattava SOLO `on: pull_request`, ma su questo
# repo si pubblica spingendo dritto su main: non e' mai partito nemmeno una
# volta. Nel frattempo `20260709_onboarding_completed.sql` e' rimasta due mesi
# nel repo senza essere applicata, e il titolare si e' ritrovato la procedura
# di benvenuto a ogni dispositivo nuovo.
#
# Ora scatta anche sui push a main. Da qui il database non e' raggiungibile,
# quindi qui si puo' solo elencare: il controllo vero ("questa migrazione e'
# davvero nello schema?") lo fa `scripts/check-migrazioni-applicate.mjs`, nel
# cancello pre-push, dove le credenziali ci sono.

name: Migration check

on:
  pull_request:
    paths:
      - 'supabase/migrations/**.sql'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'

permissions:
  pull-requests: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # serve per il diff vs base
      - name: Identifica nuove migration
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # Primo push su un ramo nuovo: non c'e' un "prima" con cui confrontare.
            git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="$HEAD~1"
          fi
          NEW=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" \
            -- 'supabase/migrations/*.sql' | sort)
          if [ -z "$NEW" ]; then
            echo "No new migrations"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Found new migrations:"
            echo "$NEW"
            echo "found=true" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$NEW" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      - name: Riepilogo (anche sui push diretti)
        if: steps.diff.outputs.found == 'true'
        run: |
          {
            echo "## Migrazioni nuove in questo commit"
            echo
            echo '${{ steps.diff.outputs.files }}' | sed 's/^/- `/; s/$/`/'
            echo
            echo "Vanno applicate nell'editor SQL di Supabase."
            echo "Il cancello pre-push verifica che ci siano davvero:"
            echo '`node scripts/check-migrazioni-applicate.mjs`'
          } >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: steps.diff.outputs.found == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ steps.diff.outputs.files }}`.trim().split('\n')
            const list = files.map(f => `- \`${f}\``).join('\n')
            const body = `## ⚠️ Nuove migration in questa PR\n\n` +
              `${list}\n\n` +
              `**Prima di mergiare**, applica queste migration nel SQL editor di Supabase (prod).\n` +
              `Altrimenti gli endpoint che chiamano le nuove RPC falliranno post-deploy.\n\n` +
              `<sub>Auto-comment by \`.github/workflows/migration-check.yml\`</sub>`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })
